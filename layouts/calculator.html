{{ define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title entry-hint-parent">{{ .Title }}</h1>
    {{- if .Description }}<div class="post-description">{{ .Description }}</div>{{ end }}
    <div class="post-meta">기준: 2026년 1월 고용24 안내 · 간이 모의계산</div>
  </header>
  <div class="post-content">
    <p>통상임금과 단축 전후 근로시간만 넣으면 예상 월 급여 보전액을 알려드립니다. 입력값은 서버로 전송되지 않고 브라우저 안에서만 계산됩니다.</p>

    {{ partial "embed/calculator.html" . }}

    {{ partial "embed_code.html" . }}

    {{ .Content }}
  </div>
</article>
<script src="/js/reduced-work-hours-calc.js" defer></script>
{{ end }}
